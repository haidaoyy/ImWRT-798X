---
name: Build ImmortalWrt ASR3000itb

on:
  workflow_dispatch:  # 支持手动触发
  push:
    branches: [ "main" ]
    paths:
      - '.github/workflows/build-asr3000itb.yml'
      - 'asr3000itb.config'



env:
  CONFIG_FILE: asr3000itb.config
  UPLOAD_BIN_DIR: false
  UPLOAD_FIRMWARE: true
  UPLOAD_RELEASE: true
  TZ: Asia/Shanghai



jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android
          sudo apt-get autoremove --purge -y
          df -h

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk gcc-multilib \
            gettext git libncurses5-dev libssl-dev python3-distutils \
            python3-setuptools rsync swig unzip zlib1g-dev file wget

      - name: Clone ImmortalWrt source
        run: |
          git clone -b 25.12 --depth=1 https://github.com/chasey-dev/immortalwrt-mt798x-rebase.git openwrt
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Load custom config
        run: |
          [ -e $CONFIG_FILE ] && mv $CONFIG_FILE openwrt/.config
          cd openwrt
          make defconfig

      - name: Download packages
        run: |
          cd openwrt
          make download -j$(nproc) || make download -j1 V=s

      - name: Compile firmware
        run: |
          cd openwrt
          echo -e "$(nproc) thread compile"
          make -j$(nproc) V=s || make -j1 V=s

      - name: Upload artifacts
        uses: actions/upload-artifact@v5
        with:
          name: ImmortalWrt-ASR3000-${{ github.run_number }}
          path: openwrt/bin/targets/mediatek/filogic/*asr3000*
          retention-days: 7
---

